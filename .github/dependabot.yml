version: 2

updates:
  # Development dependencies only — both implementations ship with zero required
  # runtime dependencies, and that is intended to stay true.
  - package-ecosystem: npm
    directory: /implementations/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /examples/typescript-vitest
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /implementations/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
