name: Release @spool/hif

on:
  push:
    tags:
      - 'typescript-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm provenance, which lets consumers verify the package was
      # built from this repository by this workflow rather than from a laptop.
      id-token: write
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: implementations/typescript/package-lock.json

      - run: npm ci

      - name: Verify the tag matches package.json
        # A tag that disagrees with the manifest publishes the wrong version
        # under the right-looking name, which is very hard to undo.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#typescript-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag is $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Full check
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Conformance must pass before anything is published
        working-directory: .
        run: |
          ./conformance/verify-vectors.sh
          python3 -m pip install -e 'implementations/python[dev]'
          ./conformance/cross-check.sh

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/') || inputs.dry_run }}
        run: |
          echo "Dry run: everything passed, nothing published."
          npm pack --dry-run
