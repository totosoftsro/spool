name: Release spool-hif

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted publishing: PyPI verifies the release came from this workflow in
      # this repository, so no long-lived API token is stored anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: implementations/python
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          PKG_VERSION="$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag is $TAG_VERSION but pyproject.toml says $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Full check
        working-directory: implementations/python
        run: |
          pip install -e '.[dev]'
          ruff check src tests
          mypy
          pytest -q

      - name: Conformance must pass before anything is published
        run: |
          ./conformance/verify-vectors.sh
          (cd implementations/typescript && npm ci && npm run build)
          ./conformance/cross-check.sh

      - name: Build distributions
        working-directory: implementations/python
        run: |
          pip install build
          python -m build

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: implementations/python/dist

      - name: Dry run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/') || inputs.dry_run }}
        working-directory: implementations/python
        run: |
          echo "Dry run: everything passed, nothing published."
          ls -l dist
