[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "spool-hif"
version = "0.1.0"
description = "Record and replay HTTP traffic using the portable HIF fixture format. Deterministic matching, explained mismatches, redaction on by default."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "http",
  "testing",
  "record",
  "replay",
  "fixture",
  "mock",
  "hif",
  "vcr",
  "cassette",
  "integration-testing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# No runtime dependencies. The httpx and requests adapters import their client
# lazily, so neither is required to use the core, the CLI, or the other adapter.
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]
dev = [
  "pytest>=7.4",
  "httpx>=0.24",
  "requests>=2.28",
  "mypy>=1.8",
  "ruff>=0.5",
  "types-requests>=2.31",
]

[project.scripts]
spool = "spool.cli:main"

[project.urls]
Homepage = "https://github.com/totosoftsro/spool"
Specification = "https://github.com/totosoftsro/spool/blob/main/specification/hif-1.0.md"
Issues = "https://github.com/totosoftsro/spool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spool"]

[tool.hatch.build.targets.sdist]
# The conformance suite lives outside this directory, so an sdist cannot run it.
# Everything needed to use and typecheck the package is included.
include = ["src", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The PEP 585/604 rules (typing.List -> list, Optional[X] -> X | None) are
# disabled deliberately: this package supports Python 3.9, and while
# `from __future__ import annotations` makes the new syntax safe in annotations,
# it is not safe in the runtime positions this codebase also uses (dataclass
# defaults, cast targets, isinstance checks). Keeping one consistent style
# avoids a subtle split between "annotation" and "value" contexts.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/spool"]
